name: commerce
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
jobs:
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r warehouse/requirements-lock.txt
      - run: python -m pytest --capture=sys -q warehouse/pytests
  recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: recsys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r recsys/requirements.txt
      - name: Real dbt, learned miniature pipeline, leakage and HTTP contracts
        run: python -m pytest --capture=sys -q recsys/tests
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/run_all.sh
      - uses: actions/upload-artifact@v4
        with: {name: hillstrom-analysis, path: results/experiments/}
  orchestration-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: orchestration
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pure replay, bounded-resource adapter and dashboard contracts
        run: |
          python -B -m unittest discover -s orchestration/tests -p test_pure.py -v
          python -B -m unittest discover -s orchestration/tests -p test_resources.py -v
          python -B -m unittest discover -s orchestration/tests -p test_dashboard.py -v
          python -B -m unittest discover -s orchestration/tests -p test_export_downstream_evidence.py -v
  orchestration-synthetic-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: orchestration
      PYTHONDONTWRITEBYTECODE: '1'
      SPARK_LOCAL_IP: 127.0.0.1
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Bind isolated runner scratch paths
        env:
          M4_CI_ROOT: ${{ runner.temp }}/m4
        run: |
          echo "M4_CI_ROOT=$M4_CI_ROOT" >> "$GITHUB_ENV"
          echo "M4_SYNTHETIC_FIXTURE=$M4_CI_ROOT/synthetic-fixture" >> "$GITHUB_ENV"
          echo "M4_RUNTIME_TEST_ROOT=$M4_CI_ROOT/definitions" >> "$GITHUB_ENV"
          echo "M4_DBT_MANIFEST=$M4_CI_ROOT/definitions/manifest-parse/dbt-target/manifest.json" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/m4-pip-cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/m4-tmp" >> "$GITHUB_ENV"
          echo "M4_CI_VENV=$RUNNER_TEMP/m4-training-venv" >> "$GITHUB_ENV"
          echo "M4_CI_PYTHON=$RUNNER_TEMP/m4-training-venv/bin/python" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/m4-pip-cache" "$RUNNER_TEMP/m4-tmp"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            orchestration/requirements-runtime.txt
            orchestration/requirements-ci.txt
            spark/requirements-runtime.txt
            orchestration/requirements-ci-training.txt
            recsys/requirements.txt
      - name: Generate independent synthetic baskets and retained hashes
        run: |
          mkdir -p "$M4_CI_ROOT"
          python orchestration/scripts/build_synthetic_fixture.py --out "$M4_SYNTHETIC_FIXTURE" --source-sha "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21.0.13+9'}
      - name: Install one isolated CPU training environment and retain actual identities
        run: |
          mkdir -p "$M4_CI_ROOT/environment"
          python -m venv "$M4_CI_VENV"
          echo "$M4_CI_VENV/bin" >> "$GITHUB_PATH"
          "$M4_CI_PYTHON" -m pip install torch --index-url https://download.pytorch.org/whl/cpu --report "$M4_CI_ROOT/environment/pip-cpu-torch-install-report.json"
          "$M4_CI_PYTHON" -m pip install -r orchestration/requirements-ci-training.txt --report "$M4_CI_ROOT/environment/pip-combined-install-report.json"
          "$M4_CI_PYTHON" -m pip check > "$M4_CI_ROOT/environment/pip-check.txt"
          java -version 2> "$M4_CI_ROOT/environment/java-version.txt"
          "$M4_CI_PYTHON" -m pip freeze --all > "$M4_CI_ROOT/environment/pip-freeze.txt"
          "$M4_CI_PYTHON" - <<'PY'
          from importlib import metadata
          import json, os, sys
          from pathlib import Path
          import torch, faiss, lightgbm, fastapi, uvicorn, httpx
          root=Path(os.environ['M4_CI_ROOT'])/'environment'
          report=json.loads((root/'pip-cpu-torch-install-report.json').read_text())
          installed=[row for row in report['install'] if row['metadata']['name'].lower()=='torch']
          assert len(installed)==1
          assert Path(sys.prefix).resolve()==Path(os.environ['M4_CI_VENV']).resolve()
          assert sys.prefix!=sys.base_prefix
          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          assert not torch.backends.cuda.is_built()
          assert metadata.version('torch')==installed[0]['metadata']['version']
          identity={'scope':'isolated synthetic integration CI; CPU only',
              'executable':sys.executable,'prefix':sys.prefix,'base_prefix':sys.base_prefix,
              'torch_import_version':str(torch.__version__),'torch_distribution_version':metadata.version('torch'),
              'torch_distribution_path':str(metadata.distribution('torch')._path),
              'torch_cuda_build':torch.version.cuda,'cuda_available':torch.cuda.is_available(),
              'cuda_compiled':torch.backends.cuda.is_built(),
              'requested_torch_index':'https://download.pytorch.org/whl/cpu',
              'actual_torch_download_info':installed[0]['download_info'],
              'packages':{name:metadata.version(name) for name in
                  ('dagster','dagster-dbt','dbt-core','dbt-duckdb','duckdb','numpy','pyspark',
                   'scipy','pandas','faiss-cpu','lightgbm','fastapi','uvicorn','httpx','pytest')}}
          (root/'cpu-torch-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          PY
      - name: Downstream cache guards and fixture opt-in contracts
        run: python -m pytest --capture=sys -q orchestration/tests/test_downstream_completion.py
      - name: Prepare synthetic definitions and check import side effects
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['M4_CI_ROOT'])
          fixture=Path(os.environ['M4_SYNTHETIC_FIXTURE'])
          identity=json.loads((fixture/'attribution.json').read_text())
          assert identity['data_kind']=='synthetic_test'
          config=json.loads(Path('orchestration/config/fixture.json').read_text())
          config.update(runtime_root=str(root),raw_dir=str(fixture),data_kind='synthetic_test')
          (root/'fixture.config.json').write_text(json.dumps(config))
          PY
          python orchestration/scripts/run_manual.py --config "$M4_CI_ROOT/fixture.config.json" --run-root "$M4_RUNTIME_TEST_ROOT" --raw-dir "$M4_SYNTHETIC_FIXTURE" --definitions-only
          python -B -m unittest discover -s orchestration/tests -p test_runtime_contract.py -v
      - name: Full synthetic commerce_all with three CPU fits and localhost HTTP
        run: python orchestration/scripts/run_fixture.py --fixture "$M4_SYNTHETIC_FIXTURE" --runtime-root "$M4_CI_ROOT/runs" --enable-training
      - name: Verify actual three-seed models, HTTP samples, lifecycle and synthetic label
        run: |
          python - <<'PY'
          import hashlib, json, math, os, subprocess, sys
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text())
          def digest(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          base=Path(os.environ['M4_CI_ROOT'])
          runs=[p for p in (base/'runs').iterdir() if p.is_dir() and p.name.startswith('fixture-')]
          assert len(runs)==1
          root=runs[0]
          config=load(root/'config.json')
          assert config['data_kind']=='synthetic_test' and config['training_enabled'] is True
          assert config['training_seeds']==[42,43,44] and config['http_seed']==42
          assert (config['training_epochs'],config['ranker_rounds'],config['candidates'])==(1,5,12)
          assert (config['http_requests'],config['http_concurrency'])==(20,2)
          assert load(root/'provenance.json')['data_kind']=='synthetic_test'
          assert load(root/'arrival_manifest.json')['data_kind']=='synthetic_test'
          cpu=load(base/'environment/cpu-torch-identity.json')
          models=load(root/'model-run.json'); api=load(root/'api-run.json')
          assert models['status']=='completed' and models['seeds']==[42,43,44]
          assert models['http_seed_predeclared']==42 and len(models['per_seed_paths'])==3
          feature=load(root/'terminal/features/manifest.json')
          results=[]
          for seed,path in zip(models['seeds'],models['per_seed_paths']):
              path=Path(path).resolve()
              assert path.is_relative_to(root.resolve()) and path.is_file()
              result=load(path); tower=result['two_tower']
              assert tower['seed']==seed and len(tower['epochs'])==1
              assert tower['positive_rows_per_epoch']>0
              assert all(row['examples']==tower['positive_rows_per_epoch'] and math.isfinite(row['loss']) for row in tower['epochs'])
              assert tower['initial_weights_sha256']!=tower['final_weights_sha256']
              assert result['runtime']['device']=='cpu' and result['runtime']['torch']==cpu['torch_import_version']
              assert result['dataset']['split_sha256']==feature['split_sha256']
              assert result['dataset']['feature_fingerprint']==feature['feature_fingerprint']
              checkpoint=root/f'models/seed-{seed}/artifacts/two_tower.pt'
              assert checkpoint.is_file() and checkpoint.stat().st_size>0
              results.append({'seed':seed,'metric_path':str(path),'metric_sha256':digest(path),
                  'model_run_id':result['model_run_id'],'final_weights_sha256':tower['final_weights_sha256'],
                  'checkpoint_sha256':digest(checkpoint),'epochs':len(tower['epochs'])})
          assert len({r['final_weights_sha256'] for r in results})==3
          assert len({r['model_run_id'] for r in results})==3
          assert api['status']=='completed' and api['predeclared_seed']==42
          assert api['excluded_warmups']==50 and api['concurrency']==2 and api['repetitions']==1
          raw_path=Path(api['raw_http']).resolve()
          assert raw_path.is_relative_to(root.resolve())
          raw=load(raw_path)
          assert raw['requests']==raw['successful_responses']==20 and raw['errors']==0
          assert raw['warmup_requests']==50 and raw['concurrency']==2 and raw['k']==10
          assert raw['status_counts']=={'200':20} and len(raw['raw_requests'])==20
          assert [r['request'] for r in raw['raw_requests']]==list(range(20))
          assert all(r['status']==200 and math.isfinite(r['client_ms']) and math.isfinite(r['handler_ms']) for r in raw['raw_requests'])
          serving=load(root/'models/seed-42/artifacts/serving.json')
          assert raw['model_run_id']==serving['model_run_id']==results[0]['model_run_id']
          assert Path(serving['feature_cache']).resolve()==(root/'terminal/features').resolve()
          lifecycle=load(root/'api-lifecycle.json')
          assert lifecycle['owned_pid'] is not None and lifecycle['owned_process_terminated'] is True
          coordinator=load(root/'coordinator.json')
          terminal=load(root/'children'/f"{coordinator['terminal_child_run_id']}.json")
          materializations=[e for e in terminal['events'] if e['event_type']=='ASSET_MATERIALIZATION']
          for name in ('recsys_train_eval','api_benchmark'):
              assert sum(e['step_key']==name for e in materializations)==1
          subprocess.run([sys.executable,'orchestration/scripts/summarize_run.py','--run-root',str(root)],check=True)
          output=base/'dashboard'
          subprocess.run([sys.executable,'orchestration/scripts/build_dashboard.py','--run-root',str(root),'--out',str(output)],check=True)
          snapshot=load(output/'snapshot.json')
          assert snapshot['data_kind']=='synthetic_test'
          assert snapshot['recommendations']['status']==snapshot['api']['status']=='completed'
          assert snapshot['api']['requests']==20 and snapshot['api']['errors']==0
          assert 'Synthetic test fixture' in (output/'index.html').read_text()
          acceptance={'status':'pass','scope':'synthetic end-to-end CI wiring; not historical-data quality/performance',
              'data_kind':'synthetic_test','models':results,'raw_http_sha256':digest(raw_path),
              'measured_requests':20,'warmup_requests_excluded':50,'all_HTTP_status':200,
              'selected_serving_seed':42,'model_run_id':raw['model_run_id'],
              'owned_API_terminated':lifecycle['owned_process_terminated'],
              'terminal_assets_once':['recsys_train_eval','api_benchmark'],
              'cpu_identity_sha256':digest(base/'environment/cpu-torch-identity.json')}
          (base/'downstream-ci-acceptance.json').write_text(json.dumps(acceptance,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-synthetic-fixture-evidence
          path: |
            ${{ runner.temp }}/m4/**/*.json
            ${{ runner.temp }}/m4/**/*.jsonl
            ${{ runner.temp }}/m4/**/*.log
            ${{ runner.temp }}/m4/**/*.txt
            ${{ runner.temp }}/m4/**/active-overlay.csv
            ${{ runner.temp }}/m4/dashboard/index.html
          retention-days: 7
