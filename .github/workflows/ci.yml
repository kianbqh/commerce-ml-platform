name: CI
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train one epoch, run all tests, and exercise HTTP serving
        env:
          EPOCHS: '1'
          REQUESTS: '100'
          CONCURRENCY: '4'
        run: bash scripts/run_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-validation
          path: results/
