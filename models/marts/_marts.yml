version: 2
models:
  - name: fct_order_lines
    description: One row per order line (33.8M). Incremental append keyed on order_id.
    data_tests:
      - unique_combination: {arguments: {columns: ["order_id", "product_id"]}}
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_products'), field: product_id}}
      - name: user_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_users'), field: user_id}}
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: basket_size
        data_tests:
          - not_null
          - is_between: {arguments: {min_value: 1, max_value: 200}}
      - name: reorder_share
        data_tests:
          - is_between: {arguments: {min_value: 0, max_value: 1}}
      - name: eval_set
        data_tests:
          - accepted_values: {arguments: {values: ["prior", "train"]}}
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: department_name
        data_tests: [not_null]
  - name: dim_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values: {arguments: {values: ["light", "regular", "power"]}}
      - name: reorder_rate
        data_tests:
          - is_between: {arguments: {min_value: 0, max_value: 1}}
  - name: mart_department_kpis
    columns:
      - name: department_id
        data_tests: [unique, not_null]
  - name: mart_hourly_demand
    data_tests:
      - unique_combination: {arguments: {columns: ["order_dow", "order_hour_of_day"]}}
  - name: mart_user_retention
    description: "Observed order-history span shares; legacy model name retained for compatibility."
    columns:
      - name: span_threshold_days
        data_tests: [unique]
      - name: observed_span_share
        data_tests:
          - is_between: {arguments: {min_value: 0, max_value: 1}}
  - name: mart_product_pairs
    data_tests:
      - unique_combination: {arguments: {columns: ["product_a", "product_b"]}}
    columns:
      - name: lift
        data_tests: [not_null]
