version: 2
models:
  - name: batch_department_integer_stats
    description: Exact integer sufficient statistics by simulated arrival batch and department.
    data_tests:
      - unique_combination: {arguments: {columns: [batch, department_id]}}
    columns:
      - name: batch
        data_tests: [not_null]
      - name: department_id
        data_tests: [not_null]
      - name: n_lines
        data_tests: [not_null]
  - name: batch_hourly_integer_stats
    data_tests:
      - unique_combination: {arguments: {columns: [batch, order_dow, order_hour_of_day]}}
    columns:
      - name: batch
        data_tests: [not_null]
      - name: order_dow
        data_tests: [not_null]
      - name: order_hour_of_day
        data_tests: [not_null]
  - name: batch_product_integer_stats
    data_tests:
      - unique_combination: {arguments: {columns: [batch, product_id]}}
    columns:
      - name: batch
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
