name: instacart_analytics
version: "1.0.0"
config-version: 2
profile: instacart_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # which raw order_products files to include; scripts/run_all.sh first loads only 'prior'
  # and then adds 'train' to demonstrate an incremental load
  eval_sets: ["prior", "train"]

models:
  instacart_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
